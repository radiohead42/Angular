<h1>DragonBall</h1>

<hr />

<section class="row">

  <div class="col-12 col-md-6">

    <h3>Agregar: {{ name() }}</h3>
    <input type="text" class="form-control" placeholder="Nombre" [value]="name()" (change)="name.set( txtName.value )" #txtName />

    <h3>Power: {{ power() }}</h3>
    <input type="number" class="form-control mt-2" placeholder="Poder" [value]="power()" (change)="power.set( txtPower.valueAsNumber )" #txtPower />

    <button (click)="addCharacter()" class="mt-2 btn btn-primary">Agregar</button>
  </div>

  <div  class="col-12 col-sm-6">
    <ul>
    @for( character of characters(); track character.id;  let idx = $index ){
    @if( character.power > 70){

    <li>
      <span> {{idx}} - {{ character.name }}</span>
      <strong  [class.text-danger]="character.power > 90"
        [class.text-info]="character.power < 91"> {{ character.power }}</strong>
    </li>
    } @else{
    <li><strong>Personajes con poder menor a 70</strong></li>
    }
    }
    </ul>
  </div>

</section>
